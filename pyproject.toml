[project]
name = "0day-ai"
version = "0.1.0"
description = "LangGraph multi-agent vulnerability scanner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.15.0",
    "graphifyy==0.9.99",
    "langchain_core==1.7.3",
    "langchain_openai==1.7.3",
    "langgraph==1.2.19",
    "langgraph-checkpoint-sqlite==3.1.3",
    "langsmith==0.14.16",
    "markdown-it-py==4.2.0",
    "networkx==3.7",
    "numpy==2.5.4",
    "openai==3.42.0",
    "playwright==1.64.1",
    "pydantic==2.14.2",
    "python-dotenv==1.2.4",
    "Requests==2.34.2",
    "tavily_python==0.8.5",
    "tree_sitter==0.26.0",
    "tree_sitter_go==0.25.0",
    "tree_sitter_javascript==0.25.0",
    "tree_sitter_php==0.25.1",
    "tree_sitter_python==0.25.0",
    "tree_sitter_typescript==0.23.2",
    "weasyprint==70.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.codespell]
ignore-words-list = "thirdparty"

[dependency-groups]
dev = [
    "pytest==9.2.0",
]
